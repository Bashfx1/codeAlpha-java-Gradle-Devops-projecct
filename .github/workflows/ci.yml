name: Java Gradle CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Build application
        run: ./gradlew clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: app/build/libs/app.jar

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: app/build/libs

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app/build/libs/app.jar"
          target: "/home/ubuntu/app"
          strip_components: 3

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ -f /home/ubuntu/app/app.pid ]; then
              kill $(cat /home/ubuntu/app/app.pid) || true
              rm -f /home/ubuntu/app/app.pid
            fi

            nohup java -jar /home/ubuntu/app/app.jar > /home/ubuntu/app/app.log 2>&1 &
            echo $! > /home/ubuntu/app/app.pid

            sleep 3

            if kill -0 $(cat /home/ubuntu/app/app.pid) 2>/dev/null; then
              echo "Application deployed successfully."
            else
              echo "Application failed to start."
              cat /home/ubuntu/app/app.log
              exit 1
            fi